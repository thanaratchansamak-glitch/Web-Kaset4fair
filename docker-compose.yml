services:
  kaset4fair-app:
    build: .
    container_name: kaset4fair-app
    restart: always
    ports:
      - "127.0.0.1:4001:4001"
    environment:
      - PORT=4001
      - NODE_ENV=production
      - DB_PATH=/app/data/kaset4fair.db
    # log ของแอปส่งเข้า journald ให้ Alloy ส่งต่อไประบบ monitor .116 (identifier=kasetfair)
    logging:
      driver: journald
      options:
        tag: kasetfair
    volumes:
      - /home/kaset4fair/data:/app/data:z
